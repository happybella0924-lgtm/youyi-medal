<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友谊奖章 · 专家评审结果</title>
<link rel="stylesheet" href="fonts/misans-local.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--orange:#e8622a;--orange-deep:#c4520e;--bg:#f6f5f2;--text:#1a2332;--muted:#7b8794;--line:#e7e2dc;--card:rgba(255,255,255,.76);--shadow:0 16px 48px rgba(26,35,50,.08);--sans:'MiSans',-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);background:linear-gradient(135deg,#F5B0A0 0%,#FAF8F6 50%,#B8C3E8 100%);background-attachment:fixed}a{color:inherit}.page{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:42px 0 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px}.brand-title{font-weight:800;font-size:18px}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}.nav-link{padding:9px 16px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,255,255,.55);text-decoration:none;font-size:13px;color:var(--muted);backdrop-filter:blur(16px)}.hero{margin-bottom:24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--orange);text-transform:uppercase}.hero h1{margin:10px 0 8px;font-size:clamp(34px,6vw,72px);line-height:1.02;letter-spacing:-.06em}.hero p{margin:0;color:var(--muted);font-size:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.stat{padding:18px 20px;background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(22px)}.stat-num{font-size:32px;font-weight:850;letter-spacing:-.04em;color:var(--orange)}.stat-label{font-size:12px;color:var(--muted);margin-top:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 18px}.toolbar h2{font-size:22px;margin:0}.refresh{border:0;border-radius:999px;background:#111;color:#fff;padding:10px 18px;font-family:inherit;font-weight:650;cursor:pointer}.refresh:active{transform:scale(.98)}.grid{display:grid;gap:18px}.line-card{background:var(--card);border:1px solid rgba(255,255,255,.76);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(22px)}.line-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:22px 24px;border-bottom:1px solid rgba(0,0,0,.06)}.line-name{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%}.line-meta{font-size:13px;color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 16px;text-align:left;border-bottom:1px solid rgba(0,0,0,.05);font-size:14px}.table th{font-size:12px;color:var(--muted);font-weight:700;background:rgba(255,255,255,.32)}.table tr:last-child td{border-bottom:0}.rank{width:62px;font-weight:850;color:var(--orange)}.votes{font-weight:850;font-size:18px}.public{color:var(--muted);font-size:12px}.empty,.error{padding:28px;background:rgba(255,255,255,.65);border-radius:22px;color:var(--muted)}.winner{background:rgba(232,98,42,.07)}.winner .rank{font-size:20px}.updated{font-size:12px;color:var(--muted)}@media(max-width:760px){.page{width:min(100% - 28px,1180px);padding-top:26px}.topbar,.toolbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.line-head{align-items:flex-start;flex-direction:column}.table{display:block;overflow-x:auto}.table th,.table td{white-space:nowrap}}
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="brand"><img src="logo.png" alt="友谊奖章"><div><div class="brand-title">友谊奖章</div><div class="brand-sub">专家评审结果看板</div></div></div>
    <a class="nav-link" href="expert.html">返回专家评审</a>
  </header>
  <section class="hero">
    <div class="eyebrow">EXPERT REVIEW RESULTS</div>
    <h1>专家评审结果</h1>
    <p>数据来自 Supabase <code>expert_votes</code> 表，按故事和业务线实时统计。</p>
  </section>
  <section class="stats" id="stats"></section>
  <div class="toolbar"><h2>按业务线排名</h2><div style="display:flex;align-items:center;gap:12px"><span class="updated" id="updated">加载中…</span><button class="refresh" onclick="loadResults()">刷新数据</button></div></div>
  <section class="grid" id="results"><div class="empty">正在读取专家评审数据…</div></section>
</main>
<script>
const SUPA_URL='https://mvgqbipgqcyysxuwtcen.supabase.co';
const SUPA_KEY='sb_publishable_LYHVLxm6py1iTajGEK6o8A_WR_Yd8_M';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
const EXPERT_REVIEW_START_AT='2026-09-20T03:08:27Z';
const LINE_NAMES={delivery:'交付线',service:'服务线',sales:'销售线'};
const LINE_COLORS={delivery:'#3b82f6',service:'#10b981',sales:'#f59e0b'};
const FINAL_PUBLIC_VOTES={1:30,2:29,3:25,4:26,5:69,6:203,7:203,8:137,9:74,10:35,11:251,12:207,13:360,14:31,15:313,16:135,17:40,18:364,19:18,20:64,21:25,22:65,23:134,24:227,25:21,26:36,27:46,28:263,29:58,30:16,31:14,32:23,33:26,34:33,35:32,36:142,37:64,38:48,39:42,40:15,41:39,42:23,43:21,44:143,45:203};
const EXPERT_STORIES={
  delivery:[{id:15,author:'杨燕',title:'投诉不是终点，是新关系的起点。'},{id:22,author:'荆子豪',title:'手写信，最纯粹的感谢'},{id:20,author:'石含嘉',title:'三个小时，等一条验证码，等一个回家的信号'},{id:29,author:'马兴源',title:'真诚相助，暖心同行'},{id:17,author:'梁业辉',title:'首例外籍客户车衣服务'},{id:26,author:'郭心蕊',title:'丝带蒙眼的浪漫求婚时刻'},{id:10,author:'徐彬',title:'一次远程托付，一份全力以赴'}],
  service:[{id:18,author:'王磊',title:'用一次真诚沟通，换一场双向奔赴'},{id:13,author:'李冰',title:'2小时48分的对话'},{id:28,author:'马云飞',title:'“不是亲人胜似亲人”'},{id:11,author:'徐美琳',title:'小米温度，让世界看见'},{id:24,author:'赵花平',title:'脚底下的“一箱水”'},{id:12,author:'成都龙潭寺小米售后服务中心',title:'爱会传递'},{id:6,author:'周涛',title:'车是好车，不用反反复复黑了'},{id:7,author:'常怡龙',title:'抵触到信任，这份认可源于全力以赴'},{id:45,author:'李芳春',title:'倒车上山，轮胎报废，他跟在后头'}],
  sales:[{id:44,author:'石启艳',title:'主动化解客诉危机，极致服务守住订单与口碑'},{id:36,author:'李为梅',title:'把握政策窗口期，专业赋能促成异地成交'},{id:37,author:'李天熠',title:'“战败”线索里的“生机”'},{id:38,author:'李强',title:'信任不是一次建立的。它也是重复出来的。'},{id:39,author:'李玉红',title:'“菠菜你看，我一个人开出来了，三百公里。”'},{id:41,author:'董浩',title:'“走了，老伙计。”'},{id:34,author:'张小龙',title:'我一定推荐给你'}]
};
const STORY_BY_ID=Object.values(EXPERT_STORIES).flat().reduce((m,s)=>{m[s.id]=s;return m},{});
async function fetchAllExpertVotes(){
  let all=[],from=0,page=1000;
  while(true){
    const {data,error}=await supa.from('expert_votes').select('story_id,expert_token,created_at').gte('created_at',EXPERT_REVIEW_START_AT).range(from,from+page-1);
    if(error)throw error;
    if(!data||!data.length)break;
    all=all.concat(data);
    if(data.length<page)break;
    from+=page;
  }
  return all;
}
function renderStats(rows,ranked){
  const expertCount=new Set(rows.map(r=>r.expert_token).filter(Boolean)).size;
  const votedStories=ranked.filter(r=>r.expertVotes>0).length;
  document.getElementById('stats').innerHTML=[
    ['专家票总数',rows.length],['参与专家数',expertCount],['获得专家票故事',votedStories],['入围故事数',ranked.length]
  ].map(([label,num])=>`<div class="stat"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`).join('');
}
function renderLine(line,items){
  return `<article class="line-card"><div class="line-head"><div><div class="line-name"><span class="dot" style="background:${LINE_COLORS[line]}"></span>${LINE_NAMES[line]}</div><div class="line-meta">${items.length} 个入围故事</div></div><div class="line-meta">专家票 / 大众票</div></div><table class="table"><thead><tr><th>排名</th><th>故事</th><th>作者</th><th>专家票</th><th>大众票</th></tr></thead><tbody>${items.map((s,i)=>`<tr class="${i===0?'winner':''}"><td class="rank">#${i+1}</td><td>${s.title}</td><td>${s.author}</td><td class="votes">${s.expertVotes}</td><td class="public">${s.publicVotes}</td></tr>`).join('')}</tbody></table></article>`;
}
async function loadResults(){
  const results=document.getElementById('results');
  results.innerHTML='<div class="empty">正在读取专家评审数据…</div>';
  try{
    const rows=await fetchAllExpertVotes();
    const counts={};
    rows.forEach(r=>{const id=Number(r.story_id);counts[id]=(counts[id]||0)+1});
    const ranked=[];
    Object.entries(EXPERT_STORIES).forEach(([line,items])=>items.forEach(s=>ranked.push({...s,line,expertVotes:counts[s.id]||0,publicVotes:FINAL_PUBLIC_VOTES[s.id]||0})));
    renderStats(rows,ranked);
    results.innerHTML=['delivery','sales','service'].map(line=>renderLine(line,ranked.filter(s=>s.line===line).sort((a,b)=>b.expertVotes-a.expertVotes||b.publicVotes-a.publicVotes||a.id-b.id))).join('');
    document.getElementById('updated').textContent='更新于 '+new Date().toLocaleString('zh-CN');
  }catch(e){
    results.innerHTML=`<div class="error">读取失败：${e.message||e}</div>`;
    document.getElementById('updated').textContent='读取失败';
  }
}
loadResults();
</script>
</body>
</html>
